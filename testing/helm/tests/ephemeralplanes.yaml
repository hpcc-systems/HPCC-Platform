storage:
  planes:
  - name: dali
    storageClass: "-"
    storageSize: 1Gi
    prefix: "/var/lib/HPCCSystems/dalistorage"
    category: dali
  - name: sasha
    storageClass: ""
    storageSize: 1Gi
    prefix: "/var/lib/HPCCSystems/sashastorage"
    category: sasha
  - name: dll
    storageClass: ""
    storageSize: 1Gi
    prefix: "/var/lib/HPCCSystems/queries"
    category: dll
  - name: data
    storageClass: ""
    storageSize: 1Gi
    prefix: "/var/lib/HPCCSystems/hpcc-data"
    category: data
  - name: mydropzone
    storageClass: ""
    storageSize: 1Gi
    prefix: "/var/lib/HPCCSystems/mydropzone"
    category: lz
  - name: spill
    ephemeral: true
    storageSize: 10Gi
    prefix: "/var/lib/HPCCSystems/spill"
    category: spill
  - name: temp
    ephemeral: true
    prefix: "/var/lib/HPCCSystems/temp"
    subPath: tmp
    category: temp

thor:
- name: thor
  prefix: thor
  numWorkers: 2
  numWorkersPerPod: 2
  maxJobs: 2
  maxGraphs: 2
