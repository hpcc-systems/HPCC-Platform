name: Reusable Branch Operations

on:
  workflow_call:
    inputs:
      run_upmerge:
        type: boolean
        default: false
      run_sync:
        type: boolean
        default: false
      sync_mode:
        type: string
        default: dry-run
      upmerge_mode:
        type: string
        default: dry-run
      repository:
        type: string
        default: all
    secrets:
      BRANCH_APP_ID_INTERNAL:
        required: true
      BRANCH_APP_PRIVATE_KEY_INTERNAL:
        required: true
      BRANCH_APP_ID_OSS:
        required: false
      BRANCH_APP_PRIVATE_KEY_OSS:
        required: false
      CICD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

# Only entry-point callers acquire the shared concurrency slot.
jobs:
  operations:
    if: ${{ github.repository == 'risk-hsy/HPCC-Platform' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.run_upmerge || inputs.run_sync) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUN_UPMERGE: ${{ inputs.run_upmerge }}
      RUN_SYNC: ${{ inputs.run_sync }}
      SYNC_MODE: ${{ inputs.sync_mode }}
      UPMERGE_MODE: ${{ inputs.upmerge_mode }}
      INPUT_REPOSITORY: ${{ inputs.repository }}
    steps:
      - name: Checkout authoritative scripts and policy
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          submodules: false

      - name: Validate operation and policy
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          case "$SYNC_MODE" in dry-run|apply) ;; *) echo "::error::Invalid sync mode"; exit 2;; esac
          case "$UPMERGE_MODE" in dry-run|apply) ;; *) echo "::error::Invalid upmerge mode"; exit 2;; esac
          jq -e '
            .schema_version == 1 and
            (.paused | type == "boolean") and
            (.repositories | type == "array" and length > 0)
          ' branch-policy.json >/dev/null
          echo "paused=$(jq -r '.paused' branch-policy.json)" >> "$GITHUB_OUTPUT"
          echo "Operations: upmerge=$RUN_UPMERGE ($UPMERGE_MODE); sync=$RUN_SYNC ($SYNC_MODE); repository: $INPUT_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RUN_UPMERGE" != true && "$RUN_SYNC" != true ]]; then
            echo "No operations selected; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RUN_UPMERGE" == true && "$RUN_SYNC" == true && "$UPMERGE_MODE" == dry-run ]]; then
            echo "Upmerge is simulated locally; synchronization uses actual internal remote commits, not simulated merges." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create read-only upmerge App token
        id: upmerge-read
        if: ${{ inputs.run_upmerge && inputs.upmerge_mode == 'dry-run' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BRANCH_APP_ID_INTERNAL }}
          private-key: ${{ secrets.BRANCH_APP_PRIVATE_KEY_INTERNAL }}
          owner: risk-hsy
          repositories: HPCC-Platform,ln,eclide,hpcc4j,helm-chart
          permission-contents: read

      - name: Create write-enabled upmerge App token
        id: upmerge-write
        if: ${{ inputs.run_upmerge && inputs.upmerge_mode == 'apply' && steps.settings.outputs.paused != 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BRANCH_APP_ID_INTERNAL }}
          private-key: ${{ secrets.BRANCH_APP_PRIVATE_KEY_INTERNAL }}
          owner: risk-hsy
          repositories: HPCC-Platform,ln,eclide,hpcc4j,helm-chart
          permission-contents: write
          permission-workflows: write

      - name: Upmerge internal branches
        id: upmerge
        if: ${{ inputs.run_upmerge }}
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        env:
          BRANCH_APP_TOKEN_INTERNAL: ${{ steps.upmerge-write.outputs.token || steps.upmerge-read.outputs.token }}
        run: |
          bash tools/tagging/upmerge-policy-branches.sh \
            --policy "$GITHUB_WORKSPACE/branch-policy.json" \
            --mode "$UPMERGE_MODE" --repository "$INPUT_REPOSITORY"

      - name: Create fresh internal synchronization App token
        id: internal-sync
        if: ${{ !cancelled() && steps.settings.outcome == 'success' && inputs.run_sync && (steps.settings.outputs.paused != 'true' || inputs.sync_mode == 'dry-run') }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BRANCH_APP_ID_INTERNAL }}
          private-key: ${{ secrets.BRANCH_APP_PRIVATE_KEY_INTERNAL }}
          owner: risk-hsy
          repositories: HPCC-Platform,ln,eclide,hpcc4j,helm-chart
          permission-contents: read

      - name: Create OSS synchronization App token
        id: oss-sync
        if: ${{ !cancelled() && steps.settings.outcome == 'success' && inputs.run_sync && (steps.settings.outputs.paused != 'true' || inputs.sync_mode == 'dry-run') }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BRANCH_APP_ID_OSS }}
          private-key: ${{ secrets.BRANCH_APP_PRIVATE_KEY_OSS }}
          owner: hpcc-systems
          repositories: HPCC-Platform,ln,eclide,hpcc4j,helm-chart
          permission-contents: write
          permission-workflows: write

      - name: Synchronize verified internal refs
        if: ${{ !cancelled() && steps.settings.outcome == 'success' && inputs.run_sync && (steps.settings.outputs.paused == 'true' && inputs.sync_mode == 'apply' || steps.internal-sync.outcome == 'success' && steps.oss-sync.outcome == 'success') }}
        timeout-minutes: 45
        shell: bash
        env:
          BRANCH_APP_TOKEN_INTERNAL: ${{ steps.internal-sync.outputs.token }}
          BRANCH_APP_TOKEN_OSS: ${{ steps.oss-sync.outputs.token }}
        run: |
          bash tools/tagging/sync-oss-branches.sh \
            --policy "$GITHUB_WORKSPACE/branch-policy.json" \
            --mode "$SYNC_MODE" --repository "$INPUT_REPOSITORY"

      - name: Preserve upmerge failure status after synchronization
        if: ${{ !cancelled() && steps.upmerge.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Upmerge failed; independent synchronization was still attempted. See operation output."
          exit 1

  notify-failure:
    name: Notify Teams of failure
    needs: operations
    if: ${{ always() && needs.operations.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post failure notification
        shell: bash
        env:
          CICD_WEBHOOK_URL: ${{ secrets.CICD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          : "${CICD_WEBHOOK_URL:?CICD_WEBHOOK_URL secret is missing}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message="$GITHUB_WORKFLOW failed in $GITHUB_REPOSITORY (run $GITHUB_RUN_NUMBER, attempt $GITHUB_RUN_ATTEMPT)."
          jq -n --arg message "$message" --arg url "$run_url" '{
            type: "message",
            attachments: [{
              contentType: "application/vnd.microsoft.card.adaptive",
              contentUrl: null,
              content: {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                type: "AdaptiveCard",
                version: "1.2",
                body: [{type: "TextBlock", text: $message, wrap: true}],
                actions: [{type: "Action.OpenUrl", title: "View failed run", url: $url}]
              }
            }]
          }' | curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-binary @- "$CICD_WEBHOOK_URL"
