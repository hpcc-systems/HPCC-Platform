name: PR Build and Test (build-vcpkg.yml)
on:
  workflow_dispatch:
    inputs:
      nightly:
        type: boolean
        description: 'Run the nightly job set'
        required: false
        default: false
      os:
        type: choice
        options:
          - 'ubuntu-24.04'
          - 'ubuntu-22.04'
          - 'rockylinux-8'
        description: 'Operating System'
        required: false
        default: 'ubuntu-22.04'
      smoketest:
        type: boolean
        description: 'Run Smoketest'
        required: false
        default: false

  push:
    tags:
      - "community_*"
      - "!HPCC*"

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "master"
      - "candidate-*"

  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  pull-requests: read
  packages: read

jobs:
  # Keep prerequisites successful on tag pushes; guard PR-only work at step level.
  # Failed-job and label-triggered triage reruns reuse this successful job.
  clear-ready-to-test:
    if: ${{ contains('pull_request,push', github.event_name) }}
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Clear ready-to-test after a PR head update
        if: ${{ github.event.action == 'synchronize' }}
        uses: actions/github-script@v7
        with:
          script: |
            // This step is not designed to work with forked repositories.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              throw new Error('PR head changed; refusing to clear the label from an outdated run');
            }
            if (pr.labels.some(label => label.name === 'ready-to-test')) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.issue.number,
                  name: 'ready-to-test',
                });
                core.info('Removed ready-to-test after PR head update');
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info('ready-to-test was already removed');
              }
            } else {
              core.info('No ready-to-test label to remove');
            }

  # Severity outputs feed triage: High includes Critical; Low does not block builds.
  wait-for-copilot-review:
    if: ${{ contains('pull_request,push', github.event_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pull-requests: read
      contents: read
    outputs:
      has-high-issues: ${{ steps.result.outputs.has-high-issues }}
      has-medium-issues: ${{ steps.result.outputs.has-medium-issues }}
      has-low-issues: ${{ steps.result.outputs.has-low-issues }}
      review-completed: ${{ steps.result.outputs.review-completed }}
    steps:
      - name: Wait for Copilot review (up to 30 minutes)
        if: ${{ github.event_name == 'pull_request' }}
        id: result
        uses: actions/github-script@v7
        with:
          script: |
            // Copilot severity is currently presentation markup, not a structured API field.
            // Support the observed v2 overview format and fail closed if that format changes.
            function getIssueFlags(body) {
              if (!body?.startsWith('<!-- ccr-overview-v2 -->')) {
                throw new Error('Unrecognized Copilot review overview format');
              }

              const openIssues = body.match(/<details open>\s*<summary><strong>(\d+) open issues?<\/strong><\/summary>([\s\S]*?)<\/details>/);
              if (!openIssues) {
                const overview = body.split(/<details\b/)[0];
                if (/^\*\*No open issues\*\*/m.test(overview)) {
                  return { high: false, medium: false, low: false };
                }
                throw new Error('Copilot review has no recognizable open-issue summary');
              }

              const count = Number(openIssues[1]);
              const findings = openIssues[2].split('\n').filter(line => /^-\s/.test(line));
              const severities = findings.map(line =>
                line.match(/<img\b[^>]*\balt="(High|Critical|Medium|Low) severity"/i)?.[1]?.toLowerCase()
              );
              if (findings.length !== count || severities.some(severity => !severity)) {
                throw new Error('Copilot review has missing or unrecognized severity badges');
              }
              return {
                high: severities.some(severity => severity === 'high' || severity === 'critical'),
                medium: severities.includes('medium'),
                low: severities.includes('low'),
              };
            }

            const maxAttempts = 40;  // 20 minutes @ 30s intervals
            let attempt = 0;
            core.setOutput('review-completed', 'false');

            // Cache for tree SHAs to avoid redundant commits fetch across polling attempts
            let headCommitTree = null;
            const reviewedCommitTrees = {};

            while (attempt < maxAttempts) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                ...context.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });

              const headSha = context.payload.pull_request.head.sha;

              // Filter for valid Copilot code reviews
              const copilotReviews = reviews.filter(review =>
                review.is_copilot_code_review === true &&
                review.submitted_at &&
                ['COMMENTED', 'APPROVED', 'CHANGES_REQUESTED'].includes(review.state)
              );

              // Phase 1: Try direct commit SHA match (handles normal PRs)
              let copilot = copilotReviews.findLast(review =>
                review.commit_id === headSha
              );

              // Phase 2: If no exact match, compare tree SHAs to handle force-pushed branches with identical content
              if (!copilot && copilotReviews.length > 0) {
                // Fetch head tree only once
                if (!headCommitTree) {
                  const { data: headCommit } = await github.rest.git.getCommit({
                    ...context.repo,
                    commit_sha: headSha,
                  });
                  headCommitTree = headCommit.tree.sha;
                }

                for (const review of [...copilotReviews].reverse()) {
                  // Fetch and cache reviewed tree SHAs
                  if (!(review.commit_id in reviewedCommitTrees)) {
                    const { data: reviewedCommit } = await github.rest.git.getCommit({
                      ...context.repo,
                      commit_sha: review.commit_id,
                    });
                    reviewedCommitTrees[review.commit_id] = reviewedCommit.tree.sha;
                  }

                  if (reviewedCommitTrees[review.commit_id] === headCommitTree) {
                    copilot = review;
                    core.info(
                      `Accepting Copilot review ${review.id}: ` +
                      `reviewed commit ${review.commit_id} has the same tree as ${headSha}`
                    );
                    break;
                  }
                }
              }

              if (copilot) {
                const issues = getIssueFlags(copilot.body);
                core.setOutput('has-high-issues', issues.high);
                core.setOutput('has-medium-issues', issues.medium);
                core.setOutput('has-low-issues', issues.low);
                core.setOutput('review-completed', 'true');
                core.info(`Copilot review ${copilot.id} completed. Has High or Critical issues: ${issues.high}; Medium: ${issues.medium}; Low: ${issues.low}`);
                return;
              }

              attempt++;
              core.info(`Waiting for Copilot review (${attempt}/${maxAttempts})...`);

              if (attempt < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, 30000)); // 30 seconds
              }
            }

            throw new Error('Copilot review timeout after 30 minutes');
  
  analyze-changes:
    if: ${{ contains('pull_request,push', github.event_name) }}
    runs-on: ubuntu-slim
    outputs:
      changes: ${{ steps.analyze.outputs.changes }}
      impacts: ${{ steps.analyze.outputs.impacts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: analyze
        uses: ./.github/actions/analyze-changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.after }}

  # Consumers use this gate's impacts without depending directly on the analyzer.
  triage:
    needs: [clear-ready-to-test, wait-for-copilot-review, analyze-changes]
    if: ${{ !cancelled() && contains('pull_request,push', github.event_name) }}
    runs-on: ubuntu-slim
    outputs:
      impacts: ${{ needs.analyze-changes.outputs.impacts }}
    permissions:
      pull-requests: read
    steps:
      - name: Gate builds on review findings or ready-to-test
        uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            if (needs['analyze-changes'].result !== 'success') {
              throw new Error('Change analysis must succeed before triage');
            }
            const impacts = JSON.parse(needs['analyze-changes'].outputs.impacts);
            const categories = ['platform', 'eclwatch', 'docs', 'unittests', 'regression-suite',
                                'roxie', 'thor', 'hthor', 'esp', 'dali'];
            if (!impacts || Array.isArray(impacts) ||
                categories.some(name => typeof impacts[name] !== 'boolean')) {
              throw new Error('Change analysis impacts must contain boolean values for all required categories');
            }
            if (context.eventName !== 'pull_request') {
              core.info('Copilot triage is not required for tag pushes');
              return;
            }
            if (needs['clear-ready-to-test'].result !== 'success') {
              throw new Error('Label cleanup must succeed before triage');
            }
            const review = needs['wait-for-copilot-review'];
            if (review.result !== 'success' || review.outputs['review-completed'] !== 'true') {
              throw new Error('Copilot review must complete successfully before triage');
            }
            const severities = ['has-high-issues', 'has-medium-issues'];
            if (severities.some(name => !['true', 'false'].includes(review.outputs[name]))) {
              throw new Error('Copilot review severity outputs are missing or invalid');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            // A new push may race cancellation, or an old run may be manually rerun.
            // Do not apply the current PR's labels to an older commit's review results.
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              throw new Error('PR head changed; rerun the workflow for the latest PR commit.');
            }
            if (pr.labels.some(label => label.name === 'ready-to-test')) {
              core.info('ready-to-test overrides High, Critical, and Medium review findings');
              return;
            }
            if (severities.some(name => review.outputs[name] === 'true')) {
              throw new Error('Copilot found High, Critical, or Medium issues; resolve them or apply ready-to-test');
            }
            core.info('No High, Critical, or Medium review findings');

  build-workflow-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly != true }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ${{ inputs.os }}
      upload-package: true
      asset-name: 'docker-package'
    secrets: inherit

  test-workflow-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly != true && inputs.smoketest == true }}
    needs: build-workflow-dispatch
    uses: ./.github/workflows/test-smoke-gh_runner.yml
    with:
      os: ${{ inputs.os }}
      asset-name: 'docker-package'
    secrets: inherit

  build-docker-ubuntu-24_04-arm64:
    needs: [triage]
    if: ${{ contains('pull_request,push', github.event_name) && fromJSON(needs.triage.outputs.impacts).platform }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ubuntu-24.04
      tag_postfix: "-arm64"
    secrets: inherit

  build-docker-ubuntu-24_04:
    needs: [triage]
    if: ${{ contains('pull_request,push', github.event_name) && fromJSON(needs.triage.outputs.impacts).platform }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ubuntu-24.04
    secrets: inherit

  build-docker-ubuntu-22_04-arm64-package:
    needs: [triage]
    if: ${{ contains('pull_request,push', github.event_name) && fromJSON(needs.triage.outputs.impacts).platform }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ubuntu-22.04
      tag_postfix: "-arm64"
      upload-package: true
      asset-name: 'docker-ubuntu-22_04-arm64'
    secrets: inherit

  build-docker-ubuntu-22_04:
    needs: [triage]
    # Every package-consuming test must have a matching producer condition.
    if: >-
      ${{ contains('pull_request,push', github.event_name) &&
          (fromJSON(needs.triage.outputs.impacts).platform ||
           fromJSON(needs.triage.outputs.impacts).unittests ||
           fromJSON(needs.triage.outputs.impacts)['regression-suite']) }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ubuntu-22.04
      upload-package: true
      asset-name: 'docker-ubuntu-22_04'
    secrets: inherit

  test-smoke-docker-ubuntu-22_04:
    needs: [build-docker-ubuntu-22_04, triage]
    if: >-
      ${{ contains('pull_request,push', github.event_name) &&
          (fromJSON(needs.triage.outputs.impacts).roxie ||
           fromJSON(needs.triage.outputs.impacts).thor ||
           fromJSON(needs.triage.outputs.impacts).hthor ||
           fromJSON(needs.triage.outputs.impacts)['regression-suite']) }}
    uses: ./.github/workflows/test-smoke-gh_runner.yml
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04'
      run-roxie-tests: ${{ fromJSON(needs.triage.outputs.impacts).roxie || fromJSON(needs.triage.outputs.impacts)['regression-suite'] }}
      run-thor-tests: ${{ fromJSON(needs.triage.outputs.impacts).thor || fromJSON(needs.triage.outputs.impacts)['regression-suite'] }}
      run-hthor-tests: ${{ fromJSON(needs.triage.outputs.impacts).hthor || fromJSON(needs.triage.outputs.impacts)['regression-suite'] }}
    secrets: inherit

  test-regression-suite-k8s-ubuntu-22_04:
    needs: [triage]
    if: ${{ contains('pull_request,push', github.event_name) && (fromJSON(needs.triage.outputs.impacts).esp || fromJSON(needs.triage.outputs.impacts)['regression-suite']) }}
    uses: ./.github/workflows/test-regression-suite-k8s.yml
    secrets: inherit
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04-containerized'

  test-unit-docker-ubuntu-22_04:
    needs: [build-docker-ubuntu-22_04, triage]
    if: ${{ contains('pull_request,push', github.event_name) && (fromJSON(needs.triage.outputs.impacts).unittests || fromJSON(needs.triage.outputs.impacts).platform) }}
    uses: ./.github/workflows/test-unit-gh_runner.yml
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04'
    secrets: inherit

  test-bundles-on-thor-ubuntu-22_04:
    needs: [build-docker-ubuntu-22_04, triage]
    if: ${{ contains('pull_request,push', github.event_name) && (fromJSON(needs.triage.outputs.impacts).thor || fromJSON(needs.triage.outputs.impacts)['regression-suite']) }}
    uses: ./.github/workflows/bundleTest-thor.yml
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04'
      generate-zap: ""
    secrets: inherit

  test-eclwatch-gh_runner-ubuntu-22_04:
    needs: [build-docker-ubuntu-22_04, triage]
    if: ${{ contains('pull_request,push', github.event_name) && fromJSON(needs.triage.outputs.impacts).eclwatch }}
    uses: ./.github/workflows/test-eclwatch.yml
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04'
    secrets: inherit

  test-documentation-ubuntu-22_04:
    needs: [triage]
    if: ${{ contains('pull_request,push', github.event_name) && fromJSON(needs.triage.outputs.impacts).docs }}
    uses: ./.github/workflows/test-documentation.yml
    with:
      os: 'ubuntu-22.04'
      asset-name: 'Documentation'

  build-docker-rockylinux-8:
    if: ${{ contains('schedule,push', github.event_name) || (github.event_name == 'workflow_dispatch' && inputs.nightly == true) }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: rockylinux-8
    secrets: inherit

  build-docker-wasm32-emscripten:
    needs: [triage]
    if: ${{ contains('pull_request,push', github.event_name) && fromJSON(needs.triage.outputs.impacts).platform }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: wasm32-emscripten
      cmake-configuration-ex: '-DEMSCRIPTEN=ON'
      build-type: 'MinSizeRel'
    secrets: inherit

  build-gh_runner-ubuntu-22_04:
    if: ${{ contains('schedule,push', github.event_name) || (github.event_name == 'workflow_dispatch' && inputs.nightly == true) }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: ubuntu-22.04
    secrets: inherit

  build-gh_runner-windows-2022:
    needs: [triage]
    if: ${{ contains('pull_request,push', github.event_name) && fromJSON(needs.triage.outputs.impacts).platform }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: windows-2022
      cmake-configuration-ex: '-T host=x64 -A x64 -DUSE_CPPUNIT=OFF -DCLIENTTOOLS_ONLY=ON -DUSE_AZURE=OFF -DINCLUDE_PLUGINS=OFF -DUSE_CASSANDRA=OFF -DUSE_PARQUET=OFF -DUSE_JAVA=OFF -DUSE_OPENLDAP=OFF'
    secrets: inherit

  build-gh_runner-windows-2025:
    if: ${{ contains('schedule,push', github.event_name) || (github.event_name == 'workflow_dispatch' && inputs.nightly == true) }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: windows-2025
      cmake-configuration-ex: '-T host=x64 -A x64 -DUSE_CPPUNIT=OFF -DCLIENTTOOLS_ONLY=ON -DINCLUDE_PLUGINS=OFF -DUSE_AZURE=OFF -DUSE_CASSANDRA=OFF -DUSE_PARQUET=OFF -DUSE_JAVA=OFF -DUSE_OPENLDAP=OFF'
    secrets: inherit

  build-gh_runner-macos-15-x86_64:
    needs: [triage]
    if: ${{ contains('pull_request,push', github.event_name) && fromJSON(needs.triage.outputs.impacts).platform }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: macos-15-intel
      build-type: 'Release'
      cmake-configuration-ex: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCPACK_SYSTEM_NAME=Darwin-x86_64 -DUSE_PYTHON3=OFF -DUSE_CPPUNIT=OFF -DCLIENTTOOLS_ONLY=ON -DINCLUDE_PLUGINS=OFF -DUSE_AZURE=OFF -DUSE_CASSANDRA=OFF -DSUPPRESS_CASSANDRAEMBED=ON -DUSE_JAVA=OFF -DUSE_OPENLDAP=OFF'
    secrets: inherit

  build-gh_runner-macos-15:
    needs: [triage]
    if: ${{ contains('pull_request,push', github.event_name) && fromJSON(needs.triage.outputs.impacts).platform }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: macos-15
      build-type: 'Release'
      cmake-configuration-ex: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DUSE_CPPUNIT=OFF -DCLIENTTOOLS_ONLY=ON -DINCLUDE_PLUGINS=OFF -DUSE_AZURE=OFF -DUSE_CASSANDRA=OFF -DSUPPRESS_CASSANDRAEMBED=ON -DUSE_JAVA=OFF -DUSE_OPENLDAP=OFF'
    secrets: inherit

  build-build-eclwatch:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly == true) }}
    uses: ./.github/workflows/build-eclwatch.yml
    with:
      os: 'ubuntu-22.04'
      asset-name: 'eclwatch-nightly'
    secrets: inherit
