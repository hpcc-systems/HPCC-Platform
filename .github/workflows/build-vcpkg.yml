name: PR Build and Test (build-vcpkg.yml)
on:
  workflow_dispatch:
    inputs:
      nightly:
        type: boolean
        description: 'Run the nightly job set'
        required: false
        default: false
      os:
        type: choice
        options:
          - 'ubuntu-24.04'
          - 'ubuntu-22.04'
          - 'rockylinux-8'
        description: 'Operating System'
        required: false
        default: 'ubuntu-22.04'
      smoketest:
        type: boolean
        description: 'Run Smoketest'
        required: false
        default: false

  push:
    tags:
      - "community_*"
      - "!community_8.10.*"
      - "!community_8.8.*"
      - "!community_8.6.*"
      - "!community_8.4.*"
      - "!community_8.2.*"
      - "!community_8.0.*"
      - "!community_7.*"
      - "!HPCC*"

  pull_request:
    branches:
      - "master"
      - "candidate-*"
      - "!candidate-7.10.*"
      - "!candidate-7.8.*"
      - "!candidate-7.6.*"
      - "!candidate-7.4.*"
      - "!candidate-7.2.*"
      - "!candidate-7.0.*"
      - "!candidate-6.*"

  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  pull-requests: read
  packages: read

jobs:
  pre_job:
    if: ${{ contains('pull_request,push', github.event_name) }}
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      workflows: ${{ steps.skip_check.outputs.workflows }}
      platform: ${{ steps.skip_check.outputs.platform }}
      plugins: ${{ steps.skip_check.outputs.plugins }}
      dockerfiles: ${{ steps.skip_check.outputs.dockerfiles }}
      helm: ${{ steps.skip_check.outputs.helm }}
      ecllibrary: ${{ steps.skip_check.outputs.ecllibrary }}
      eclwatch: ${{ steps.skip_check.outputs.eclwatch }}
      docs: ${{ steps.skip_check.outputs.docs }}
      testing: ${{ steps.skip_check.outputs.testing }}
      initfiles: ${{ steps.skip_check.outputs.initfiles }}
      vcpkg: ${{ steps.skip_check.outputs.vcpkg }}
      other: ${{ steps.skip_check.outputs.other }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: skip_check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflows:
              - ".github/workflows/**"
            platform:
              - "clienttools/**"
              - "cmake_modules/**"
              - "common/**"
              - "configuration/**"
              - "dali/**"
              - "deploy/**"
              - "deployment/**"
              - "ecl/**"
              - "esp/**"
              - "!esp/src/**"
              - "!esp/eclwatch/**"
              - "fs/**"
              - "lib2/**"
              - "package/**"
              - "plugins/**"
              - "roxie/**"
              - "rtl/**"
              - "services/**"
              - "system/**"
              - "thorlcr/**"
              - "tools/**"
              - "vcpkg/**"
              - "vcpkg-overlays/**"
            plugins:
              - "plugins/**"
            dockerfiles:
              - "dockerfiles/**"
            helm:
              - "helm/**"
              - "testing/helm/**"
            ecllibrary:
              - "ecllibrary/**"
            eclwatch:
              - "esp/eclwatch/**"
              - "esp/src/**"
            docs:
              - "docs/**"
              - ".github/workflows/test-documentation.yml"
            testing:
              - "testing/**"
            initfiles:
              - "initfiles/**"
            vcpkg:
              - "vcpkg/**"
              - "vcpkg-overlays/**"
            other:
              - "charm/**"
              - "devdoc/**"
              - "devel/**"
              - "githooks/**"
              - "install/**"
              - "misc/**"
          list-files: json
      - name: Print changed paths
        run: |
          echo "=== Path Filter Report ==="
          echo "Filters with changes: ${{ steps.skip_check.outputs.changes }}"
          echo ""
          
          # Parse the JSON array of changed filters
          changed_filters='${{ steps.skip_check.outputs.changes }}'
          
          # Iterate through each changed filter
          for filter in $(echo "$changed_filters" | jq -r '.[]'); do
            echo "### ${filter^} ###"
            
            # Get the files for this filter
            files_var="${filter}_files"
            files_json=$(echo '${{ toJSON(steps.skip_check.outputs) }}' | jq -r --arg key "$files_var" '.[$key]')
            
            if [[ "$files_json" != "null" && "$files_json" != "" ]]; then
              echo "$files_json" | jq -r '.[]'
            else
              echo "No files detected"
            fi
            echo ""
          done
          
          echo "=========================="

  # Usage in other jobs:
  # To gate a job on this review completing with no High or Critical issues, add:
  #   needs: wait-for-copilot-review
  #   if: dollar{{ needs.wait-for-copilot-review.outputs.review-completed == 'true' && needs.wait-for-copilot-review.outputs.has-high-issues == 'false' }}
  # Example:
  #   deploy:
  #     needs: wait-for-copilot-review
  #     if: dollar{{ needs.wait-for-copilot-review.outputs.review-completed == 'true' && needs.wait-for-copilot-review.outputs.has-high-issues == 'false' }}
  #     runs-on: ubuntu-latest
  #     steps: ...
  wait-for-copilot-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      pull-requests: read
    outputs:
      has-high-issues: ${{ steps.result.outputs.has-high-issues }}
      review-completed: ${{ steps.result.outputs.review-completed }}
    steps:
      - name: Wait for Copilot review (up to 30 minutes)
        id: result
        uses: actions/github-script@v7
        with:
          script: |
            // Copilot severity is currently presentation markup, not a structured API field.
            // Support the observed v2 overview format and fail closed if that format changes.
            function hasHighIssues(body) {
              if (!body?.startsWith('<!-- ccr-overview-v2 -->')) {
                throw new Error('Unrecognized Copilot review overview format');
              }

              const openIssues = body.match(/<details open>\s*<summary><strong>(\d+) open issues?<\/strong><\/summary>([\s\S]*?)<\/details>/);
              if (!openIssues) {
                const overview = body.split(/<details\b/)[0];
                if (/^\*\*No open issues\*\*/m.test(overview)) {
                  return false;
                }
                throw new Error('Copilot review has no recognizable open-issue summary');
              }

              const count = Number(openIssues[1]);
              const findings = openIssues[2].split('\n').filter(line => /^-\s/.test(line));
              const severities = findings.map(line =>
                line.match(/<img\b[^>]*\balt="(High|Critical|Medium|Low) severity"/i)?.[1]?.toLowerCase()
              );
              if (findings.length !== count || severities.some(severity => !severity)) {
                throw new Error('Copilot review has missing or unrecognized severity badges');
              }
              return severities.some(severity => severity === 'high' || severity === 'critical');
            }

            const maxAttempts = 60;  // 30 minutes @ 30s intervals
            let attempt = 0;
            core.setOutput('review-completed', 'false');

            while (attempt < maxAttempts) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                ...context.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });

              const copilot = reviews.findLast(review =>
                review.is_copilot_code_review === true &&
                review.commit_id === context.payload.pull_request.head.sha &&
                review.submitted_at &&
                ['COMMENTED', 'APPROVED', 'CHANGES_REQUESTED'].includes(review.state)
              );

              if (copilot) {
                const hasHigh = hasHighIssues(copilot.body);
                core.setOutput('has-high-issues', hasHigh);
                core.setOutput('review-completed', 'true');
                core.info(`Copilot review ${copilot.id} completed. Has High or Critical issues: ${hasHigh}`);
                return;
              }

              attempt++;
              core.info(`Waiting for Copilot review (${attempt}/${maxAttempts})...`);

              if (attempt < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, 30000)); // 30 seconds
              }
            }

            throw new Error('Copilot review timeout after 30 minutes');

  build-workflow-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly != true }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ${{ inputs.os }}
      upload-package: true
      asset-name: 'docker-package'
    secrets: inherit

  test-workflow-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly != true && inputs.smoketest == true }}
    needs: build-workflow-dispatch
    uses: ./.github/workflows/test-smoke-gh_runner.yml
    with:
      os: ${{ inputs.os }}
      asset-name: 'docker-package'
    secrets: inherit

  build-docker-ubuntu-24_04-arm64:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ubuntu-24.04
      tag_postfix: "-arm64"
    secrets: inherit

  build-docker-ubuntu-24_04:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ubuntu-24.04
    secrets: inherit

  build-docker-ubuntu-22_04-arm64-package:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.platform == 'true' || needs.pre_job.outputs.testing == 'true') }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ubuntu-22.04
      tag_postfix: "-arm64"
      upload-package: true
      asset-name: 'docker-ubuntu-22_04-arm64'
    secrets: inherit

  build-docker-ubuntu-22_04:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.platform == 'true' || needs.pre_job.outputs.testing == 'true') }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: ubuntu-22.04
      upload-package: true
      asset-name: 'docker-ubuntu-22_04'
    secrets: inherit

  test-smoke-docker-ubuntu-22_04:
    needs: [build-docker-ubuntu-22_04, pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.testing == 'true' || needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/test-smoke-gh_runner.yml
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04'
    secrets: inherit

  test-regression-suite-k8s-ubuntu-22_04:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.testing == 'true' || needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/test-regression-suite-k8s.yml
    secrets: inherit
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04-containerized'

  test-unit-docker-ubuntu-22_04:
    needs: [build-docker-ubuntu-22_04, pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.testing == 'true' || needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/test-unit-gh_runner.yml
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04'
    secrets: inherit

  test-bundles-on-thor-ubuntu-22_04:
    needs: [build-docker-ubuntu-22_04, pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.testing == 'true' || needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/bundleTest-thor.yml
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04'
      generate-zap: ""
    secrets: inherit

  test-eclwatch-gh_runner-ubuntu-22_04:
    needs: [build-docker-ubuntu-22_04, pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && needs.pre_job.outputs.eclwatch == 'true' }}
    uses: ./.github/workflows/test-eclwatch.yml
    with:
      os: ubuntu-22.04
      asset-name: 'docker-ubuntu-22_04'
    secrets: inherit

  test-documentation-ubuntu-22_04:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && needs.pre_job.outputs.docs == 'true' }}
    uses: ./.github/workflows/test-documentation.yml
    with:
      os: 'ubuntu-22.04'
      asset-name: 'Documentation'

  build-docker-rockylinux-8:
    if: ${{ contains('schedule,push', github.event_name) || (github.event_name == 'workflow_dispatch' && inputs.nightly == true) }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: rockylinux-8
    secrets: inherit

  build-docker-wasm32-emscripten:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/build-docker.yml
    with:
      os: wasm32-emscripten
      cmake-configuration-ex: '-DEMSCRIPTEN=ON'
      build-type: 'MinSizeRel'
    secrets: inherit

  build-gh_runner-ubuntu-22_04:
    if: ${{ contains('schedule,push', github.event_name) || (github.event_name == 'workflow_dispatch' && inputs.nightly == true) }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: ubuntu-22.04
    secrets: inherit

  build-gh_runner-windows-2022:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: windows-2022
      cmake-configuration-ex: '-T host=x64 -A x64 -DUSE_CPPUNIT=OFF -DCLIENTTOOLS_ONLY=ON -DUSE_AZURE=OFF -DINCLUDE_PLUGINS=OFF -DUSE_CASSANDRA=OFF -DUSE_PARQUET=OFF -DUSE_JAVA=OFF -DUSE_OPENLDAP=OFF'
    secrets: inherit

  build-gh_runner-windows-2025:
    if: ${{ contains('schedule,push', github.event_name) || (github.event_name == 'workflow_dispatch' && inputs.nightly == true) }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: windows-2025
      cmake-configuration-ex: '-T host=x64 -A x64 -DUSE_CPPUNIT=OFF -DCLIENTTOOLS_ONLY=ON -DINCLUDE_PLUGINS=OFF -DUSE_AZURE=OFF -DUSE_CASSANDRA=OFF -DUSE_PARQUET=OFF -DUSE_JAVA=OFF -DUSE_OPENLDAP=OFF'
    secrets: inherit

  build-gh_runner-macos-15-x86_64:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: macos-15-intel
      build-type: 'Release'
      cmake-configuration-ex: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCPACK_SYSTEM_NAME=Darwin-x86_64 -DUSE_PYTHON3=OFF -DUSE_CPPUNIT=OFF -DCLIENTTOOLS_ONLY=ON -DINCLUDE_PLUGINS=OFF -DUSE_AZURE=OFF -DUSE_CASSANDRA=OFF -DSUPPRESS_CASSANDRAEMBED=ON -DUSE_JAVA=OFF -DUSE_OPENLDAP=OFF'
    secrets: inherit

  build-gh_runner-macos-15:
    needs: [pre_job]
    if: ${{ contains('pull_request,push', github.event_name) && (needs.pre_job.outputs.platform == 'true') }}
    uses: ./.github/workflows/build-gh_runner.yml
    with:
      os: macos-15
      build-type: 'Release'
      cmake-configuration-ex: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DUSE_CPPUNIT=OFF -DCLIENTTOOLS_ONLY=ON -DINCLUDE_PLUGINS=OFF -DUSE_AZURE=OFF -DUSE_CASSANDRA=OFF -DSUPPRESS_CASSANDRAEMBED=ON -DUSE_JAVA=OFF -DUSE_OPENLDAP=OFF'
    secrets: inherit

  build-build-eclwatch:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly == true) }}
    uses: ./.github/workflows/build-eclwatch.yml
    with:
      os: 'ubuntu-22.04'
      asset-name: 'eclwatch-nightly'
    secrets: inherit
