name: Branch Upmerge
run-name: Branch upmerge (${{ inputs.mode }}, ${{ inputs.repository }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation mode (dry-run merges locally without pushes)
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run
      repository:
        description: Policy repository ID
        required: true
        type: choice
        options: [all, platform, ln, eclide, hpcc4j, helm-chart]
        default: all

permissions:
  contents: read

concurrency:
  group: branch-synchronization-${{ github.repository }}
  cancel-in-progress: false

jobs:
  upmerge:
    if: ${{ github.repository == 'risk-hsy/HPCC-Platform' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/branch-operations.yml
    with:
      run_upmerge: true
      upmerge_mode: ${{ inputs.mode }}
      repository: ${{ inputs.repository }}
    secrets: inherit
