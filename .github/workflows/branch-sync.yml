name: Branch Synchronization
run-name: Branch sync (${{ inputs.sync_mode }}, ${{ inputs.repository }})

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: Operation mode
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: apply
      repository:
        description: Policy repository ID, or all configured repositories
        required: true
        type: choice
        options:
          - all
          - platform
          - ln
          - eclide
          - hpcc4j
          - helm-chart
        default: all

permissions:
  contents: read

concurrency:
  group: branch-synchronization-${{ github.repository }}
  # Never cancel a writer in progress. GitHub keeps only the newest pending run;
  # each run reconciles the full configured ref set, so a superseded run is recovered.
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize approved refs
    if: ${{ github.repository == 'risk-hsy/HPCC-Platform' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/branch-operations.yml
    with:
      run_sync: true
      sync_mode: ${{ inputs.sync_mode }}
      repository: ${{ inputs.repository }}
    secrets: inherit
