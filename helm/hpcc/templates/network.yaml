{{- $egress := (.Values.global.egress | default dict) -}}
{{- $egressRestricted := $egress.restricted | default false -}}
{{- $metrics := (.Values.global.metrics | default dict) -}}
{{- $hasDali := eq (include "hpcc.hasActiveDali" (dict "root" .)) "true" -}}
{{- $hasEsp := false -}}
{{- range .Values.esp }}
  {{- if not .disabled }}
    {{- $hasEsp = true }}
  {{- end }}
{{- end }}
{{- $hasSasha := and .Values.sasha (not .Values.sasha.disabled) -}}

{{- if $hasDali }}
---
##
## Default to no ingress, and egress only to DNS servers when egress is restricted by $egressRestricted
##
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-but-dns
spec:
  podSelector: {}
  policyTypes:
  - Ingress
{{- if $egressRestricted }}
  - Egress
  egress:
  - to:
 {{- if hasKey $egress "kubeSystemLabel" }}
    - namespaceSelector:
        matchLabels:
          name: {{ $egress.kubeSystemLabel }}
 {{- end }}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
---
##
## Restores the egress removed by default-deny-all-but-dns for the k8s API server, which pods
## that launch k8s jobs need. Applies to all pods, since the policy cannot tell which do so.
## Restricted to global.egress.kubeApiCidr / kubeApiPort when those are set, otherwise any
## destination / any TCP port.  Only created when egress is restricted and this release owns Dali.
##
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-apiserver
spec:
  policyTypes:
  - Egress
  podSelector: {}
  egress:
  - to:
 {{- if $egress.kubeApiCidr }}
    - ipBlock:
        cidr: {{ $egress.kubeApiCidr | quote }}
 {{- end }}
    ports:
    - protocol: TCP
 {{- if hasKey $egress "kubeApiPort" }}
      port: {{ $egress.kubeApiPort }}
 {{- end }}
{{- end }}
---
##
## Pods labeled accessDali: "yes" are allowed to communicate with the dali pods, and vice versa.
## Only created if this release owns Dali.
##
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dali-server
spec:
  podSelector:
    matchLabels:
      app: dali
  ingress:
  - from:
    - podSelector:
        matchLabels:
          accessDali: "yes"
  egress:
  - to:
    - podSelector:
        matchLabels:
          accessDali: "yes"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dali-client
spec:
  podSelector:
    matchLabels:
      accessDali: "yes"
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: dali
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: dali
{{- end }}

{{- if $hasEsp }}
---
##
## Pods labeled accessEsp: "yes" (those that run workunits, or which need to do DFU lookups)
## are allowed to communicate with the eclservices esp pods, and vice versa.
## Only created if this release contains an enabled esp.
##
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: esp-server
spec:
  podSelector:
    matchLabels:
      app: eclservices
  ingress:
  - from:
    - podSelector:
        matchLabels:
          accessEsp: "yes"
  egress:
  - to:
    - podSelector:
        matchLabels:
          accessEsp: "yes"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: esp-client
spec:
  podSelector:
    matchLabels:
      accessEsp: "yes"
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: eclservices
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: eclservices
{{- end }}

{{- if $hasSasha }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sasha-server
spec:
  podSelector:
    matchLabels:
      app: sasha
  ingress:
  - from:
    - podSelector:
        matchLabels:
          accessSasha: "yes"
{{- end }}

##
## Provides access to pods labeled prometheusMetricsReporter: "yes"
## onto port declared in global.metrics.sinks[type=prometheus].settings.port (default 8767)
## Only created if this release owns Dali and global.metrics.sinks[type=prometheus].settings.autodiscovery is true
##
{{- if and $hasDali (hasKey $metrics "sinks") }}
 {{ range $sink := $metrics.sinks -}}
  {{- if eq (get $sink "type") "prometheus" }}
   {{- if hasKey $sink "settings" }}
    {{- if hasKey $sink.settings "autodiscovery" }}
     {{- if (eq $sink.settings.autodiscovery true ) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hpcc-metrics-prometheus
spec:
  podSelector:
    matchLabels:
      prometheusMetricsReporter: "yes"
  ingress:
  - ports:
    - port: {{ $sink.settings.port | default 8767 }}
     {{- end }}
    {{- end }}
   {{- end }}
  {{- end }}
 {{- end }}
{{- end }}
