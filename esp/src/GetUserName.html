<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title class="loginStr"></title>
    <style type="text/css">
        body {
            font-family: Lucida Sans, Lucida Grande, Arial !important;
            font-size: 15px !important;
            background-color: #155d8a;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .formContainer {
            width: 500px;
            padding: 20px 0 20px 0;
            border-radius: 5px;
            background-color: #fff;
            margin: auto;
        }

        .login {
            width: 400px;
            margin: auto;
        }

        .login input {
            margin-bottom: 20px;
            width: 300px;
            padding: 8px;
            border: 1px solid #bfbfbf;
        }

        .login form {
            margin: auto;
            width: 300px;
        }

        img {
            display: block;
            margin: auto;
        }

        p {
            text-align: center
        }

        #button {
            background-color: #155d8a;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            -webkit-transition-duration: 0.4s;
            /* Safari */
            transition-duration: 0.4s;
            margin: auto;
            display: block;
        }

        .button:hover {
            background-color: #13b1f9;
            color: white;
        }

        .visible {
            display: none;
        }
    </style>
</head>

<body>
    <div id="container" class="container visible">
        <div class="formContainer">
            <img id="logo" src="eclwatch/img/hpccsystems.svg" alt="HPCC Systems" style="width: 206px" />
            <p id="loginStr" class="loginStr"></p>
            <div class="login">
                <form method="POST" action="/esp/login">
                    <input id="username" type="text" name="username" placeholder="username" class="loginStr" autofocus></input>
                    <button class="loginStr" id="button" type="submit"></button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import nlsHPCC from "src-dojo/index";

        var HPCCSystems = document.getElementById("logo");
        var loginStr = document.getElementById("loginStr");
        var username = document.getElementById("username");
        var button = document.getElementById("button");
        var enableCookies = "";

        HPCCSystems.setAttribute("alt", nlsHPCC.HPCCSystems);
        loginStr.innerHTML = nlsHPCC.PleaseLogIntoECLWatch;
        username.innerHTML = nlsHPCC.Username;
        button.innerHTML = nlsHPCC.Login;
        enableCookies = nlsHPCC.PleaseEnableCookies;

        if (navigator.cookieEnabled) {
            document.getElementById("container").classList.remove("visible");
        } else {
            alert(enableCookies);
        }
    </script>
</body>

</html>
