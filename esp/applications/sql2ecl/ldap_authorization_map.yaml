ldap:
   resourcesBasedn: ou=WsSql,ou=EspServices,ou=ecl
   root_access:
      resource: WsSQLAccess
      required: Read
      description: Base access to EclWatch
   resource_map:
      ws_ecl:
         Feature:
         -  path: WsSQLAccess
            resource: WsSQLAccess
            description: Base access to sql2ecl services
      ws_sql2:
         Feature:
         -  path: WsSql2Access
            resource: WsSQLAccess
            description: Access to WsSQL2 service (shares WsSQL access)
